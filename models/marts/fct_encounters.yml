version: 2

models:
  - name: fct_encounters
    description: >
      Fact table containing one row per healthcare encounter,
      including encounter timing and derived utilization metrics.

    columns:
      - name: encounter_id
        description: Unique identifier for the healthcare encounter.
        data_tests:
          - not_null
          - unique

      - name: patient_id
        description: Patient associated with the encounter.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id

    
      - name: provider_key
        description: >
          Surrogate key identifying the provider dimension version
          that was valid at the time of the encounter. UNKNOWN_PROVIDER
          is used when the historical provider version is unavailable.

        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_provider')
                field: provider_key


      - name: facility_id
        description: Facility where the encounter occurred.
        data_tests:
          - not_null

      - name: encounter_type
        description: Type of healthcare encounter.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Outpatient
                  - Inpatient
                  - Emergency
                  - Telehealth

      - name: admission_datetime
        description: Encounter admission/start timestamp.
        data_tests:
          - not_null

      - name: discharge_datetime
        description: Encounter discharge/end timestamp.

      - name: encounter_date
        description: Calendar date on which the encounter started.
        data_tests:
          - not_null

      - name: status
        description: Current encounter status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Completed
                  - Cancelled
                  - Scheduled

      - name: encounter_duration_minutes
        description: Duration of the encounter in minutes.

      - name: length_of_stay_days
        description: Number of days between admission and discharge.

      - name: is_inpatient
        description: Indicates whether the encounter is an inpatient encounter.

      - name: is_emergency
        description: Indicates whether the encounter is an emergency encounter.

      - name: created_at
        description: Timestamp when the encounter record was created.

      - name: updated_at
        description: Timestamp when the encounter record was last updated.