version: 2

models:
  - name: stg_facilities
    description: >
      Staging model that cleans and standardizes healthcare facility data.

    columns:
      - name: facility_id
        description: Unique identifier for the healthcare facility.
        data_tests:
          - not_null
          - unique

      - name: facility_name
        description: Name of the healthcare facility.
        data_tests:
          - not_null

      - name: facility_type
        description: Standardized type of healthcare facility.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Hospital
                  - Medical Center
                  - Clinic
                  - Unknown

      - name: city
        description: City where the facility is located.
        data_tests:
          - not_null

      - name: state
        description: State where the facility is located.
        data_tests:
          - not_null

      - name: address
        description: Physical address of the facility.

      - name: created_at
        description: Timestamp when the facility record was created.

      - name: updated_at
        description: Timestamp when the facility record was last updated.